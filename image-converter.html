<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Image Converter - MyTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background-color: #09090b;
            background-image: linear-gradient(rgba(9, 9, 11, 0.72), rgba(9, 9, 11, 0.82)), url('https://img.magnific.com/premium-photo/minimalist-workspace-featuring-computer-chair-books-ideal-coding-study_570250-4567.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        .glass-card {
            background: rgba(18, 18, 23, 0.76);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }
    </style>
</head>
<body class="text-zinc-100 min-h-screen flex flex-col">
    <!-- Header / Navigation Bar -->
    <header class="w-full bg-zinc-950/80 backdrop-blur-xl border-b border-zinc-800/80 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2.5 text-lg font-extrabold tracking-tight">
                <span class="w-8 h-8 rounded-xl bg-gradient-to-tr from-rose-500 via-amber-500 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-rose-500/20">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                </span>
                <span class="bg-gradient-to-r from-white via-zinc-200 to-zinc-400 bg-clip-text text-transparent">MyTools</span>
            </a>

            <nav class="flex items-center gap-3 sm:gap-5 text-xs sm:text-sm font-semibold text-zinc-400">
                <a href="index.html" class="hover:text-white transition">Home</a>
                <a href="image-converter.html" class="hidden md:inline text-white font-bold text-rose-400">Image Converter</a>
                <a href="pdf-to-excel.html" class="hidden md:inline hover:text-white transition">PDF to Excel</a>
                <a href="bulk-rename.html" class="hidden lg:inline hover:text-white transition">Bulk Rename</a>
                <a href="url-downloader.html" class="hidden lg:inline hover:text-white transition">URL to ZIP</a>
                <a href="file-share.html" class="hidden sm:inline hover:text-white transition">File Share</a>
                <a href="https://tyrescart-scrapping.klever.ae/tcsadmin/files" target="_blank" rel="noopener noreferrer" class="bg-gradient-to-r from-rose-500 to-orange-500 hover:from-rose-600 hover:to-orange-600 text-white px-4 py-2 rounded-xl transition font-bold shadow-lg shadow-rose-500/25 flex items-center gap-1.5">
                    <span>Data scraping</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
                    </svg>
                </a>
            </nav>
        </div>
    </header>
    <main class="flex-1 max-w-2xl w-full mx-auto px-4 py-12 flex items-center">
        <div class="glass-card p-8 rounded-2xl shadow-2xl w-full border border-rose-500/30 relative overflow-hidden">
            <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-rose-500 via-pink-500 to-orange-400"></div>
            <div class="flex items-center justify-between mb-4">
                <a href="index.html" class="text-xs text-zinc-400 hover:text-white transition">← Back to Home</a>
                <span class="text-[11px] font-semibold text-rose-400 bg-rose-500/10 px-2.5 py-0.5 rounded-full">100% Browser-Based</span>
            </div>
            <div class="flex items-center justify-center gap-2 mb-1">
                <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                <h1 class="text-2xl font-bold bg-gradient-to-r from-rose-400 to-orange-300 bg-clip-text text-transparent">Bulk Image Converter</h1>
            </div>
            <p class="text-zinc-400 text-xs text-center mb-6">Convert multiple images & download as ZIP</p>

            <div id="dropZone" class="relative flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-zinc-700 rounded-xl hover:border-rose-500 hover:bg-rose-500/5 transition overflow-hidden">
                <input id="imageInput" type="file" accept="image/*,.webp,.avif,.jfif,.png,.jpg,.jpeg" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                <div class="flex flex-col items-center justify-center text-center px-4 pointer-events-none">
                    <div class="w-11 h-11 rounded-full bg-rose-500/15 text-rose-400 flex items-center justify-center mb-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <p class="text-sm text-zinc-200"><span class="font-semibold text-rose-400">Click to select multiple images</span> or drag & drop</p>
                    <p class="text-[11px] text-zinc-500 mt-1">PNG, JPG, WEBP, AVIF, BMP</p>
                </div>
            </div>

            <div id="fileListContainer" class="hidden mt-4">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Selected Images (<span id="fileCount" class="text-rose-400">0</span>)</span>
                    <button type="button" id="clearBtn" class="text-xs text-rose-400 hover:text-rose-300 font-medium">Clear All</button>
                </div>
                <ul id="fileList" class="max-h-40 overflow-y-auto space-y-1.5 bg-zinc-950/70 p-3 rounded-xl border border-zinc-800 text-xs text-zinc-300"></ul>
            </div>

            <div class="mt-5 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-zinc-300 mb-1">Convert All To:</label>
                    <select id="formatSelect" class="w-full bg-zinc-900 border border-zinc-700 rounded-xl p-2.5 text-sm text-white focus:ring-rose-500 focus:border-rose-500 outline-none">
                        <option value="image/webp">WEBP (Best for Web / E-commerce)</option>
                        <option value="image/jpeg">JPG / JPEG</option>
                        <option value="image/png">PNG (Transparent)</option>
                    </select>
                </div>

                <div id="qualityContainer">
                    <label class="block text-xs font-medium text-zinc-300 mb-1">Quality: <span id="qualityValue" class="text-rose-400 font-bold">90</span>%</label>
                    <input id="qualitySlider" type="range" min="10" max="100" value="90" class="w-full accent-rose-500">
                </div>
            </div>

            <button type="button" id="convertBtn" disabled class="mt-6 w-full bg-gradient-to-r from-rose-500 to-orange-500 hover:from-rose-600 hover:to-orange-600 disabled:from-zinc-800 disabled:to-zinc-800 disabled:text-zinc-500 disabled:cursor-not-allowed text-white text-sm font-bold py-3.5 px-4 rounded-xl transition shadow-lg shadow-rose-500/20 disabled:shadow-none">
                <span id="btnText">Convert & Download Images</span>
            </button>
        </div>
    </main>

    <script>
        const imageInput = document.getElementById('imageInput');
        const fileListContainer = document.getElementById('fileListContainer');
        const fileList = document.getElementById('fileList');
        const fileCount = document.getElementById('fileCount');
        const clearBtn = document.getElementById('clearBtn');
        const formatSelect = document.getElementById('formatSelect');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityValue = document.getElementById('qualityValue');
        const qualityContainer = document.getElementById('qualityContainer');
        const convertBtn = document.getElementById('convertBtn');
        const btnText = document.getElementById('btnText');
        let selectedFiles = [];

        imageInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files.length > 0) {
                const valid = Array.from(e.target.files).filter(f => (f.type && f.type.startsWith('image/')) || ['.jpg','.jpeg','.png','.webp','.gif','.bmp','.avif','.jfif'].some(ext => f.name.toLowerCase().endsWith(ext)));
                selectedFiles = [...selectedFiles, ...valid];
                renderFileList();
                imageInput.value = '';
            }
        });

        function renderFileList() {
            fileList.innerHTML = '';
            fileCount.textContent = selectedFiles.length;
            if (selectedFiles.length > 0) {
                fileListContainer.classList.remove('hidden');
                convertBtn.disabled = false;
                btnText.textContent = selectedFiles.length === 1 ? 'Convert & Download Image' : `Convert & Download ZIP (${selectedFiles.length} images)`;
            } else {
                fileListContainer.classList.add('hidden');
                convertBtn.disabled = true;
                btnText.textContent = 'Convert & Download Images';
            }
            selectedFiles.forEach((file, index) => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-center bg-zinc-900 px-2.5 py-1.5 rounded-lg';
                li.innerHTML = `<span class="truncate pr-2">${index + 1}. ${file.name}</span>`;
                const delBtn = document.createElement('button');
                delBtn.type = 'button'; delBtn.className = 'text-zinc-400 hover:text-rose-400 font-bold px-1'; delBtn.textContent = '✕';
                delBtn.onclick = () => { selectedFiles.splice(index, 1); renderFileList(); };
                li.appendChild(delBtn); fileList.appendChild(li);
            });
        }

        clearBtn.addEventListener('click', () => { selectedFiles = []; renderFileList(); });
        qualitySlider.addEventListener('input', (e) => qualityValue.textContent = e.target.value);
        formatSelect.addEventListener('change', (e) => qualityContainer.style.display = e.target.value === 'image/png' ? 'none' : 'block');

        function convertImageToBlob(file, format, quality) {
            return new Promise((resolve, reject) => {
                const url = URL.createObjectURL(file);
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = img.naturalWidth || img.width;
                    canvas.height = img.naturalHeight || img.height;
                    const ctx = canvas.getContext('2d');
                    if (format === 'image/jpeg') { ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, canvas.width, canvas.height); }
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    canvas.toBlob((blob) => {
                        if (!blob) return reject(new Error('Failed'));
                        const ext = format.split('/')[1] === 'jpeg' ? 'jpg' : format.split('/')[1];
                        const baseName = file.name.lastIndexOf('.') !== -1 ? file.name.substring(0, file.name.lastIndexOf('.')) : file.name;
                        resolve({ blob, filename: `${baseName}.${ext}` });
                    }, format, quality);
                };
                img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Load error')); };
                img.src = url;
            });
        }

        convertBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;
            convertBtn.disabled = true;
            btnText.textContent = `Converting ${selectedFiles.length} images...`;
            const format = formatSelect.value;
            const quality = qualitySlider.value / 100;
            try {
                if (selectedFiles.length === 1) {
                    const { blob, filename } = await convertImageToBlob(selectedFiles[0], format, quality);
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; a.click();
                } else {
                    const zip = new JSZip(); const used = new Set();
                    for (const f of selectedFiles) {
                        let { blob, filename } = await convertImageToBlob(f, format, quality);
                        let c = 1, uName = filename;
                        while (used.has(uName)) { const d = filename.lastIndexOf('.'); uName = `${filename.substring(0, d)}_${c}${filename.substring(d)}`; c++; }
                        used.add(uName); zip.file(uName, blob);
                    }
                    const zipBlob = await zip.generateAsync({ type: 'blob' });
                    const a = document.createElement('a'); a.href = URL.createObjectURL(zipBlob); a.download = `converted_images_${Date.now()}.zip`; a.click();
                }
            } catch (e) { alert('Error converting images.'); }
            convertBtn.disabled = false; renderFileList();
        });
    </script>
</body>
</html>
