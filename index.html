<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Image Format Converter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl max-w-lg w-full border border-slate-700">
        <h1 class="text-2xl font-bold mb-1 text-center text-blue-400">Bulk Image Converter</h1>
        <p class="text-slate-400 text-sm text-center mb-6">100% Private • Convert & Download as ZIP</p>

        <!-- Upload Area: Native file input directly covers the entire box -->
        <div id="dropZone" class="relative flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-slate-600 rounded-xl hover:border-blue-500 hover:bg-slate-700/50 transition overflow-hidden">
            <input 
                id="imageInput" 
                type="file" 
                accept="image/*,.webp,.avif,.jfif,.png,.jpg,.jpeg" 
                multiple 
                class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" 
            />
            <div class="flex flex-col items-center justify-center pt-5 pb-6 text-center px-4 pointer-events-none">
                <svg class="w-8 h-8 mb-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <p class="mb-1 text-sm text-slate-300"><span class="font-semibold text-blue-400">Click here to select multiple images</span></p>
                <p class="text-xs text-slate-400">or drag & drop files here</p>
                <p class="text-[11px] text-slate-500 mt-1">Select multiple files using Ctrl / Cmd or Mouse Drag</p>
            </div>
        </div>

        <!-- Selected Files List -->
        <div id="fileListContainer" class="hidden mt-4">
            <div class="flex justify-between items-center mb-2">
                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Selected Files (<span id="fileCount">0</span>)</span>
                <button type="button" id="clearBtn" class="text-xs text-red-400 hover:text-red-300">Clear All</button>
            </div>
            <ul id="fileList" class="max-h-40 overflow-y-auto space-y-1.5 bg-slate-900/60 p-3 rounded-lg border border-slate-700 text-xs text-slate-300">
            </ul>
        </div>

        <!-- Format & Quality Selection -->
        <div class="mt-6 space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1">Convert All To:</label>
                <select id="formatSelect" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2.5 text-white focus:ring-blue-500 focus:border-blue-500">
                    <option value="image/webp">WEBP (Best for Web / E-commerce)</option>
                    <option value="image/jpeg">JPG / JPEG</option>
                    <option value="image/png">PNG (Transparent)</option>
                </select>
            </div>

            <div id="qualityContainer">
                <label class="block text-sm font-medium text-slate-300 mb-1">
                    Quality: <span id="qualityValue">90</span>%
                </label>
                <input id="qualitySlider" type="range" min="10" max="100" value="90" class="w-full accent-blue-500">
            </div>
        </div>

        <!-- Convert & Download Button -->
        <button type="button" id="convertBtn" disabled class="mt-6 w-full bg-blue-600 hover:bg-blue-700 disabled:bg-slate-600 disabled:cursor-not-allowed text-white font-semibold py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
            <span id="btnText">Convert & Download</span>
        </button>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const dropZone = document.getElementById('dropZone');
        const fileListContainer = document.getElementById('fileListContainer');
        const fileList = document.getElementById('fileList');
        const fileCount = document.getElementById('fileCount');
        const clearBtn = document.getElementById('clearBtn');
        const formatSelect = document.getElementById('formatSelect');
        const qualitySlider = document.getElementById('qualitySlider');
        const qualityValue = document.getElementById('qualityValue');
        const qualityContainer = document.getElementById('qualityContainer');
        const convertBtn = document.getElementById('convertBtn');
        const btnText = document.getElementById('btnText');

        let selectedFiles = [];

        // Highlight dropZone on drag
        imageInput.addEventListener('dragenter', () => {
            dropZone.classList.add('border-blue-500', 'bg-slate-700/70');
        });

        imageInput.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-blue-500', 'bg-slate-700/70');
        });

        imageInput.addEventListener('drop', () => {
            dropZone.classList.remove('border-blue-500', 'bg-slate-700/70');
        });

                handleFiles(e.target.files);
                imageInput.value = ''; // Reset for next selection
            }
        });
